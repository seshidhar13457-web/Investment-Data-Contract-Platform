name: Data Contract Quality Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  contract-regression-tests:

    name: Contract Regression Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Run Data Contract regression tests
        run: |
          python -m pytest tests/test_data_contract.py -v


  soda-data-quality-gate:

    name: Soda Data Quality Gate

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Load trade data into DuckDB
        run: |
          python etl/load_trades_duckdb.py

      - name: Test Soda data source
        run: |
          soda data-source test -ds soda/ds_config.yml

      - name: Run Soda contract verification
        run: |
          soda contract verify --data-source soda/ds_config.yml --contract soda/trades_contract.yml