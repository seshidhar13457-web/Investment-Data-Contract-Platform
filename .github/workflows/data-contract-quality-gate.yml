name: Data Contract Quality Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # GATE 1: CUSTOM PYTHON DATA CONTRACT REGRESSION TESTS
  # ============================================================

  contract-regression-tests:

    name: Contract Regression Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Run contract regression tests
        run: |
          python -m pytest tests/test_data_contract.py -v


  # ============================================================
  # GATE 2: SODA DATA QUALITY VALIDATION
  # ============================================================

  soda-data-quality-gate:

    name: Soda Data Quality Gate

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Load trades into DuckDB
        run: |
          python etl/load_trades_duckdb.py

      - name: Test Soda data source
        run: |
          soda data-source test -ds soda/ds_config.yml

      - name: Run Soda contract verification
        run: |
          soda contract verify \
            --data-source soda/ds_config.yml \
            --contract soda/trades_contract.yml


  # ============================================================
  # GATE 3: PRODUCER-CONSUMER CONTRACT IMPACT ANALYSIS
  # ============================================================

  contract-impact-analysis:

    name: Contract Impact Analysis

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Run producer-consumer impact tests
        run: |
          python -m pytest tests/test_contract_impact.py -v